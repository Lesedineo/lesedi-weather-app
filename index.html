<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />

    <title>First weather app</title>
  </head>
  <body>
    <div class="weather">
      <header>
        <form class="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            required
            class="search-form-input"
          />
          <input type="submit" value="search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div class="weather-data">
          <div>
            <h1 class="weather-city">Paris</h1>
            <p class="weather-details">
              Tuesday 14:30, scatterd clouds
              <br />
              Humidity:<strong> 66%</strong>, wind:<strong> 3km/h</strong>
            </p>
          </div>
          <div class="temperature-container">
            <div class="icon">🌥️</div>
            <div class="weather-temperature">12</div>
            <div class="weather-unit">°C</div>
          </div>
        </div>
      </main>
      <footer>
        This project was Coded by
        <a href="https://github.com/Lesedineo">Lesedi Molale</a>
        code hosted on
        <a href="https://github.com/Lesedineo/lesedi-weather-app">Github</a> and
        website is hosted on
        <a href="https://lesedi-weather-app.netlify.app/">Netlify</a>
      </footer>
    </div>
  </body>
</html>
