<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />

    <title>First weather app</title>
  </head>
  <body>
    <div class="weather">
      <header>
        <form>
          <input type="search" placeholder="Enter a city..." required />
          <input type="submit" value="search" />
        </form>
      </header>
      <main>
        <div>
          <h1>Paris</h1>
          <p>
            Tuesday 14:30, scatterd clouds
            <br />
            Humidity: 66%, wind: 3km/h
          </p>
        </div>
        <div>🌥️ 12°C</div>
      </main>
      <footer>
        This project was Coded by
        <a href="https://github.com/Lesedineo">Lesedi Molale</a>
        code hosted on
        <a href="https://github.com/Lesedineo/lesedi-weather-app">Github</a> and
        website is hosted on
        <a href="https://lesedi-weather-app.netlify.app/">Netlify</a>
      </footer>
    </div>
  </body>
</html>
