<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>

    <title>First weather app</title>
  </head>
  <body>
    <div class="weather">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            required
            id="search-form-input"
            class="search-form-input"
          />
          <input type="submit" value="search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div class="weather-data">
          <div>
            <h1 class="weather-city" id="city">Johannesburg</h1>
            <p class="weather-details">
              <span id="time"> </span>, <span id="description">clear sky</span>
              <br />
              Humidity:<strong id="humidity">66</strong>, wind:<strong
                id="wind-speed"
              >
                3km/h</strong
              >
            </p>
          </div>
          <div class="temperature-container">
            <div class="icon">🌥️</div>
            <div class="weather-temperature" id="temperature"></div>
            <div class="weather-unit">°C</div>
          </div>
        </div>
      </main>
      <footer>
        This project was Coded by
        <a href="https://github.com/Lesedineo">Lesedi Molale</a>
        code hosted on
        <a href="https://github.com/Lesedineo/lesedi-weather-app">Github</a> and
        website is hosted on
        <a href="https://lesedi-weather-app.netlify.app/">Netlify</a>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
